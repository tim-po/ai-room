{% extends 'base.html' %}{% block title %}Каталог{% endblock %}{% block content %}<div class="page-intro"><span class="eyebrow">От интереса к результату</span><h1>Что попробуем сегодня?</h1><p>Выберите задачу, которая пригодится в работе или личном проекте.</p></div><form method="get" class="panel filters"><label>Поиск<input type="search" name="q" value="{{ request.args.get('q','') }}" placeholder="Название, задача или инструмент" maxlength="150"></label><label>Цель<select name="goal"><option value="">Все цели</option>{% for value,label in goals.items() %}<option value="{{ value }}" {% if request.args.get('goal')==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Уровень<select name="level"><option value="">Любой</option>{% for level in ['Начальный','Продвинутый'] %}<option {% if request.args.get('level')==level %}selected{% endif %}>{{ level }}</option>{% endfor %}</select></label><button class="button">Найти</button><a href="/catalogue">Сбросить</a></form><p class="metadata">Найдено курсов: {{ courses|length }}</p>{% include '_cards.html' %}{% endblock %}
